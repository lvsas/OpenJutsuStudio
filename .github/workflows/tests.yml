name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: Python suite and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Some UI contract tests shell out to `node --test`.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: System tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test suite
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -q

      - name: Workflow graphs are reachable
        run: python scripts/audit_workflow_graphs.py

      - name: Nothing private is published
        run: python scripts/audit_privacy.py

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contract tests
        run: |
          for file in tests/timeline_async_contract.mjs tests/timeline_ui_contract.mjs; do
            node --experimental-vm-modules --test "$file"
          done

  image:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t openjutsu-studio:ci .
